<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Playa Progress</title><style>[hidden]{display:none!important}*{box-sizing:border-box}body{background:#f4f3ed;color:#173c37;font:16px system-ui;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:100%;max-width:430px;background:white;padding:32px;border-radius:24px;border:1px solid #d7ded4}h1{font-size:34px;letter-spacing:-1px}p{line-height:1.6;color:#65756c}label{display:block;margin:18px 0}input,button{font:inherit;width:100%;padding:14px;border-radius:12px}input{border:1px solid #ccd6c6;margin-top:8px}button{border:0;color:white;background:#173c37;cursor:pointer}#error{color:#984331;min-height:24px}small{color:#65756c}</style><main><small>◒ &nbsp; PLAYA PROGRESS · PRIVATE</small><h1 id="title">Welcome back.</h1><p id="intro">One account. Your progress, on every device.</p><form id="login"><label id="tokenLabel" hidden>One-time setup code<input id="token" autocomplete="off"></label><label>Password<input id="password" type="password" autocomplete="current-password" required maxlength="256"></label><label id="confirmLabel" hidden>Confirm your new password<input id="confirm" type="password" autocomplete="new-password" maxlength="256"></label><p id="error" role="alert"></p><button id="submit">Sign in</button></form><p><small>No public registration. Your workouts and measurements are visible only after sign-in.</small></p></main><script>
let setup=false;const $=id=>document.getElementById(id);async function init(){try{const r=await fetch('/api/session');const x=await r.json();if(x.authenticated){location.replace('/dashboard');return}setup=!!x.setup;$('tokenLabel').hidden=!setup;$('confirmLabel').hidden=!setup;$('token').required=setup;$('confirm').required=setup;if(setup){$('title').textContent='Make this yours.';$('intro').textContent='Enter your one-time setup code and choose a unique passphrase of at least 14 characters. This creates the only account.';$('tokenLabel').hidden=false;$('confirmLabel').hidden=false;$('password').autocomplete='new-password';$('password').minLength=14;$('submit').textContent='Create my private account';$('token').required=true;$('confirm').required=true}}catch(e){$('error').textContent='Unable to reach the server. Please refresh.'}}$('login').onsubmit=async e=>{e.preventDefault();if(setup&&$('password').value!==$('confirm').value){$('error').textContent='Passwords do not match.';return}$('submit').disabled=true;$('error').textContent='';try{const r=await fetch(setup?'/api/setup':'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value,token:$('token').value})});const x=await r.json();if(!r.ok)throw Error(x.error);location.replace('/dashboard')}catch(err){$('error').textContent=err.message;$('submit').disabled=false}};init();
</script></html>
