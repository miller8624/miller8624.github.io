name: Fitness app checks
on:
  push:
    paths: ['fitness/**', '.github/workflows/fitness-checks.yml']
  pull_request:
    paths: ['fitness/**', '.github/workflows/fitness-checks.yml']
jobs:
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fitness/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
